[workspace]
resolver = "3"
members = [
  "crates/*"
]
default-members = [
  "crates/*"
]

[workspace.package]
version = "0.1.0"
authors = ["{{authors}}"]
edition = "2024"
license = "{{license}}"

[workspace.dependencies]
anyhow = "1.0.102"
thiserror = "2.0.18"


[profile.release]
lto = true
codegen-units = 1
